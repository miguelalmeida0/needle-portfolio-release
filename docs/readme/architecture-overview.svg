<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc"><title id="title">Needle architecture</title><desc id="desc">Museum metadata search and artwork images. 10k retrieval uses metadata; image-similarity detail search covers a smaller subset.</desc><rect width="960" height="456" fill="#fff"/><rect x="1" y="1" width="958" height="454" rx="15" fill="none" stroke="#D8E0E6"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="57" font-size="31" font-weight="700" fill="#15202C">Needle</text><text x="28" y="88" font-size="17" fill="#536171">Museum metadata search and artwork images</text><text x="932" y="57" text-anchor="end" font-size="13" font-weight="700" letter-spacing="1" fill="#A66242">SYSTEM MAP</text><rect x="28" y="124" width="288" height="222" rx="12" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="28" y="124" width="288" height="5" rx="2" fill="#A66242"/><text x="49" y="164" fill="#A66242" font-size="13" font-weight="700" letter-spacing="1">INTERFACE</text><text x="49" y="207" fill="#15202C" font-size="23" font-weight="700">Collection browser</text><text x="49" y="237" fill="#536171" font-size="16">Gallery / map / collections</text><path d="M49 257h246" stroke="#D8E0E6"/><text x="49" y="285" font-size="16" fill="#233244">Query and filter controls</text><text x="49" y="317" font-size="16" fill="#233244">Result sequence guards</text><rect x="346" y="124" width="288" height="222" rx="12" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="346" y="124" width="288" height="5" rx="2" fill="#A66242"/><text x="367" y="164" fill="#A66242" font-size="13" font-weight="700" letter-spacing="1">RETRIEVAL</text><text x="367" y="207" fill="#15202C" font-size="23" font-weight="700">Browser search worker</text><text x="367" y="237" fill="#536171" font-size="16">Metadata / HNSW / lexical</text><path d="M367 257h246" stroke="#D8E0E6"/><text x="367" y="285" font-size="16" fill="#233244">10,000 frozen records</text><text x="367" y="317" font-size="16" fill="#233244">Checksum-checked graph</text><rect x="664" y="124" width="288" height="222" rx="12" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="664" y="124" width="288" height="5" rx="2" fill="#A66242"/><text x="685" y="164" fill="#A66242" font-size="13" font-weight="700" letter-spacing="1">DELIVERY</text><text x="685" y="207" fill="#15202C" font-size="23" font-weight="700">Artwork image server</text><text x="685" y="237" fill="#536171" font-size="16">Node / Sharp / disk cache</text><path d="M685 257h246" stroke="#D8E0E6"/><text x="685" y="285" font-size="16" fill="#233244">120 bundled previews</text><text x="685" y="317" font-size="16" fill="#233244">Allowlisted Met sources</text><path d="M321 227h20m-7-7 7 7-7 7" fill="none" stroke="#A66242" stroke-width="2" stroke-linejoin="round"/><path d="M639 227h20m-7-7 7 7-7 7" fill="none" stroke="#A66242" stroke-width="2" stroke-linejoin="round"/><rect x="28" y="366" width="904" height="59" rx="9" fill="#F0F4F6"/><rect x="28" y="366" width="4" height="59" rx="2" fill="#A66242"/><text x="48" y="401" font-size="16" fill="#364556">10k retrieval uses metadata; image-similarity detail search covers a smaller subset.</text></g></svg>