<svg xmlns="http://www.w3.org/2000/svg" width="460" height="734" viewBox="0 0 460 734" role="img" aria-labelledby="title desc"><title id="title">Needle architecture</title><desc id="desc">Museum metadata search and artwork images. 10k retrieval uses metadata; image-similarity detail search covers a smaller subset.</desc><rect width="460" height="734" fill="#fff"/><rect x="1" y="1" width="458" height="732" rx="13" fill="none" stroke="#D8E0E6"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="46" font-size="30" font-weight="700" fill="#15202C">Needle</text><text x="20" y="77" font-size="16" fill="#536171">Museum metadata search and artwork images</text><rect x="20" y="111" width="420" height="156" rx="11" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="20" y="111" width="4" height="156" rx="2" fill="#A66242"/><text x="40" y="136" fill="#A66242" font-size="13" font-weight="700" letter-spacing="1">INTERFACE</text><text x="40" y="171" fill="#15202C" font-size="24" font-weight="700">Collection browser</text><text x="40" y="198" fill="#536171" font-size="17">Gallery / map / collections</text><text x="40" y="228" fill="#233244" font-size="16">Query and filter controls</text><text x="40" y="251" fill="#233244" font-size="16">Result sequence guards</text><path d="M230 267v20m-6-6 6 6 6-6" fill="none" stroke="#A66242" stroke-width="2"/><rect x="20" y="287" width="420" height="156" rx="11" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="20" y="287" width="4" height="156" rx="2" fill="#A66242"/><text x="40" y="312" fill="#A66242" font-size="13" font-weight="700" letter-spacing="1">RETRIEVAL</text><text x="40" y="347" fill="#15202C" font-size="24" font-weight="700">Browser search worker</text><text x="40" y="374" fill="#536171" font-size="17">Metadata / HNSW / lexical</text><text x="40" y="404" fill="#233244" font-size="16">10,000 frozen records</text><text x="40" y="427" fill="#233244" font-size="16">Checksum-checked graph</text><path d="M230 443v20m-6-6 6 6 6-6" fill="none" stroke="#A66242" stroke-width="2"/><rect x="20" y="463" width="420" height="156" rx="11" fill="#F8FAFB" stroke="#D8E0E6"/><rect x="20" y="463" width="4" height="156" rx="2" fill="#A66242"/><text x="40" y="488" fill="#A66242" font-size="13" font-weight="700" letter-spacing="1">DELIVERY</text><text x="40" y="523" fill="#15202C" font-size="24" font-weight="700">Artwork image server</text><text x="40" y="550" fill="#536171" font-size="17">Node / Sharp / disk cache</text><text x="40" y="580" fill="#233244" font-size="16">120 bundled previews</text><text x="40" y="603" fill="#233244" font-size="16">Allowlisted Met sources</text><rect x="20" y="642" width="420" height="78" rx="8" fill="#F0F4F6"/><rect x="20" y="642" width="4" height="78" rx="2" fill="#A66242"/><text x="40" y="676" font-size="16" fill="#364556">10k retrieval uses metadata; image-similarity</text><text x="40" y="700" font-size="16" fill="#364556">detail search covers a smaller subset.</text></g></svg>