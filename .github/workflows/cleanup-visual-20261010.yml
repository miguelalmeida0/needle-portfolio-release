name: Temporary cleanup visual comparison
on:
  push:
    branches: [test]
    paths: [.github/workflows/cleanup-visual-20261010.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: portfolio
            sha: c95d3657479d0beae6889afb0905d743de210f08
            node: '22.16.0'
          - repo: second-voice
            sha: 7ba42e6488a9a22fa4cd0ede865c13849a274ea1
            node: '22'
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: miguelalmeida0/${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci && npx playwright install --with-deps chromium webkit
        working-directory: app
      - name: Build baseline Portfolio
        if: matrix.repo == 'portfolio'
        working-directory: app
        run: npm run build
      - name: Capture baseline
        working-directory: app
        env:
          TARGET_REPO: ${{ matrix.repo }}
        run: node ../control/.github/cleanup-20261010/capture.mjs "$TARGET_REPO" before "$RUNNER_TEMP/visual"
      - name: Apply only the reviewed cleanup
        working-directory: app
        env:
          TARGET_REPO: ${{ matrix.repo }}
        run: python3 ../control/.github/cleanup-20261010/apply.py "$TARGET_REPO"
      - name: Build candidate Portfolio
        if: matrix.repo == 'portfolio'
        working-directory: app
        run: npm run build
      - name: Capture candidate
        working-directory: app
        env:
          TARGET_REPO: ${{ matrix.repo }}
        run: node ../control/.github/cleanup-20261010/capture.mjs "$TARGET_REPO" after "$RUNNER_TEMP/visual"
      - name: Record exact image and computed-style differences
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'visual'
          results = [{'file': p.name, 'same': (root / 'after' / p.name).exists() and p.read_bytes() == (root / 'after' / p.name).read_bytes()} for p in sorted((root / 'before').glob('*'))]
          (root / 'comparison.json').write_text(json.dumps(results, indent=2))
          print('Exact comparisons:', sum(x['same'] for x in results), '/', len(results))
          print('Review differences:', [x['file'] for x in results if not x['same']])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cleanup-visual-${{ matrix.repo }}
          path: ${{ runner.temp }}/visual
          retention-days: 3
          if-no-files-found: error
