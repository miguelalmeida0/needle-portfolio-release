name: Release verification
on:
  # Main releases are checked on push; test work is verified via PR or dispatch.
  push:
    branches: [main]
  pull_request:
    branches: [main, test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: python3 -m unittest discover -s tests -p 'deploy_hetzner_test.py'
      - run: npm run security:history
      - run: npm audit --omit=dev
      - run: npm run prepare:previews
      - name: Build and smoke-test production container
        run: |
          docker build --tag needle-release-qa .
          docker run --detach --rm --name needle-release-qa --publish 127.0.0.1:4180:8000 needle-release-qa
          trap 'docker stop needle-release-qa' EXIT
          node scripts/smoke-container.mjs
