name: Release verification
on:
  # Main releases are checked on push; test work is verified via PR or dispatch.
  push:
    branches: [main]
  pull_request:
    branches: [main, test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run security:history
      - run: npm audit --omit=dev
      - run: npm run prepare:previews
